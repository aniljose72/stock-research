title: "Stock Research"
description: "Public stock analysis for RKLB, ASTS, SPCX"
remote_theme: "cotes2020/jekyll-theme-chirpy"
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

url: "https://aniljose72.github.io"
baseurl: "/stock-research"

# Theme preferences
theme_mode: "dark"  # dark, light, or auto
img_cdn: ""
avatar: "/assets/img/favicon.png"

# Navigation
header_pages:
  - index.md
  - research/RKLB.md
  - research/ASTS.md
  - research/SPCX.md

# Sidebar
sidebar:
  show_sidebar: true
  show_toc: true

# Search
search:
  provider: "algolia"
  algolia:
    app_id: ""
    index_name: ""
    api_key: ""

# Comments (optional - disable for now)
comments:
  provider: ""
  disqus:
    shortname: ""

# Analytics
google_analytics:
  id: ""

# Social
social:
  name: "Stock Research"
  links:
    - "https://github.com/aniljose72/stock-research"

# Footer
footer:
  since: 2026
  links:
    - "https://github.com/aniljose72/stock-research"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

collections:
  research:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
      type: "research"
    values:
      layout: "post"
      category: "Research"

exclude:
  - README.md
  - pyproject.toml
  - stock_research/
  - .gitignore
  - .git/
  - .github/
  - assets/
  - vendor/
  - Gemfile
  - Gemfile.lock