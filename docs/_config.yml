title: "Stock Research"
description: "Public stock analysis for RKLB, ASTS, SPCX"
remote_theme: "just-the-docs/just-the-docs"
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed

url: "https://aniljose72.github.io"
baseurl: "/stock-research"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true

# UI
color_scheme: "dark"
heading_anchors: true
permalink: pretty

# Navigation
nav_external_links:
  - title: "GitHub Repository"
    url: "https://github.com/aniljose72/stock-research"
    hide_icon: false

# Footer
footer_content: "Copyright &copy; 2026 Stock Research. <a href=\"https://github.com/aniljose72/stock-research\">Source on GitHub</a>. Not financial advice."

# Aux links
aux_links:
  "GitHub Repository": "https://github.com/aniljose72/stock-research"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - README.md
  - pyproject.toml
  - stock_research/
  - .gitignore
  - .git/
  - .github/
  - assets/
  - vendor/
  - Gemfile
  - Gemfile.lock