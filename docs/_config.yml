title: "Stock Research"
description: "Public stock analysis for RKLB, ASTS, SPCX"
theme: minima
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  research:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: "research"
    values:
      layout: "research"

exclude:
  - README.md
  - pyproject.toml
  - stock_research/
  - .gitignore
  - .git/