title: "Stock Research"
description: "Public stock analysis for RKLB, ASTS, SPCX"
# theme: minima  # Disabled - using custom layouts only
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

baseurl: "/stock-research"

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - README.md
  - pyproject.toml
  - stock_research/
  - .gitignore
  - .git/