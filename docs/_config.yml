title: "Stock Research"
description: "Public stock analysis for RKLB, ASTS, SPCX"
theme: minima
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-feed

baseurl: "/stock-research"
url: "https://aniljose72.github.io"

# Minima theme customization
minima:
  skin: dark
  social_links:
    github: aniljose72/stock-research

# Navigation (uses page order)
header_pages:
  - index.md
  - research/RKLB.md
  - research/ASTS.md
  - research/SPCX.md

# Search (minima doesn't have built-in search, but we can add)
# For now use Google search or Algolia

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - README.md
  - pyproject.toml
  - stock_research/
  - .gitignore
  - .git/
  - assets/
  - .github/