name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'research/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync research to docs
        run: |
          mkdir -p docs/research
          cp research/*.md docs/research/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify deployment success
        if: success()
        run: |
          curl -s -X POST "https://ntfy.sh/stock-research-deploy" \
            -H "Title: ✅ Stock Research Deployed" \
            -H "Tags: rocket,white_check_mark" \
            -H "Priority: high" \
            -d "✅ GitHub Pages deployed successfully!

Site: https://aniljose72.github.io/stock-research/
Research updated: $(date -u +'%Y-%m-%d %H:%M UTC')
Commit: ${{ github.sha }}
Workflow: ${{ github.workflow_run.name }}
URL: ${{ steps.deployment.outputs.page_url }}"

  notify-failure:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Notify deployment failure
        run: |
          curl -s -X POST "https://ntfy.sh/stock-research-deploy" \
            -H "Title: ❌ Stock Research Deploy Failed" \
            -H "Tags: x,warning" \
            -H "Priority: urgent" \
            -d "❌ GitHub Pages deployment failed!

Workflow: ${{ github.workflow_run.name }}
Commit: ${{ github.sha }}
Run: ${{ github.run_id }}
Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"