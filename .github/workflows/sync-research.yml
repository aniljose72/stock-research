name: Sync Research to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'research/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync research to docs/research
        run: |
          # Create docs/research if it doesn't exist
          mkdir -p docs/research

          # Copy research files and update front matter for GitHub Pages
          for file in research/*.md; do
            filename=$(basename "$file" .md)
            # Read the file, update front matter if needed
            if ! grep -q "permalink:" "$file"; then
              # Add permalink and layout to front matter
              sed -i "/^---$/,/^---$/ {
                /^filename:/d
                /^title:/a permalink: /research/$filename/\nlayout: research
              }" "$file"
            fi
            cp "$file" "docs/research/"
          done

          # Check if there are changes
          if git diff --quiet docs/research/; then
            echo "No changes to research files"
          else
            echo "Changes detected, committing..."
            git add docs/research/
            git commit -m "chore: sync research files to docs/research [skip ci]"
            git push
          fi